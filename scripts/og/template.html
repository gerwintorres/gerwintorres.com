<!doctype html>
<!--
  Social preview image (1200x630) for LinkedIn, WhatsApp and search results.
  Rendered to public/og-en.png and public/og-es.png by scripts/og/build.sh.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-weight: 200 800;
        src: url("../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 100 800;
        src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2");
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 430px;
        background: #0f1726;
        color: #eef2f7;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .copy {
        position: relative;
        z-index: 2;
        display: grid;
        align-content: center;
        gap: 28px;
        padding: 0 0 0 84px;
      }

      .watermark {
        position: absolute;
        top: 50%;
        left: 40px;
        z-index: 0;
        color: #eef2f7;
        font-size: 360px;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
        opacity: 0.04;
        transform: translateY(-50%);
      }

      h1 {
        display: grid;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 0.95;
        text-transform: uppercase;
      }

      h1 .accent {
        color: #f2803f;
      }

      .role {
        color: #eef2f7;
        font-size: 24px;
        font-weight: 600;
        white-space: nowrap;
      }

      .role .sep {
        color: #a7b3c4;
        font-weight: 400;
      }

      .stack {
        color: #a7b3c4;
        font-size: 22px;
      }

      .url {
        margin-top: 8px;
        color: #f2803f;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 500;
      }

      .panel {
        position: relative;
        background: linear-gradient(160deg, #141e30 0%, #35577d 100%);
        border-left: 4px solid #e0641a;
      }

      .portrait {
        position: absolute;
        bottom: 0;
        left: 50%;
        height: 600px;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <p class="watermark" aria-hidden="true">GT</p>
    <div class="copy">
      <h1>
        <span>Gerwin</span>
        <span class="accent">Lambraño</span>
        <span>Torres</span>
      </h1>
      <p class="role" id="role"></p>
      <p class="stack">Python · FastAPI · REST APIs · Azure · GCP</p>
      <p class="url">gerwintorres.com</p>
    </div>
    <div class="panel">
      <img class="portrait" src="../../src/assets/gerwin-portrait.png" alt="" />
    </div>
    <script>
      const roles = {
        en: ["Software Engineer", "Python Backend Developer"],
        es: ["Ingeniero de Software", "Desarrollador Backend Python"],
      };
      const lang = new URLSearchParams(location.search).get("lang") === "es" ? "es" : "en";
      document.documentElement.lang = lang;
      const [first, second] = roles[lang];
      document.getElementById("role").innerHTML = `${first} <span class="sep">|</span> ${second}`;
    </script>
  </body>
</html>
